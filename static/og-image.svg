<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Main content -->
  <text x="600" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">Oracle HCM Tables</text>

  <!-- Subtitle -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#a0a0a0" text-anchor="middle">Search 5,500+ Tables &amp; 240,000+ Columns</text>

  <!-- Stats boxes -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#2a2a4a"/>
    <text x="100" y="55" font-family="system-ui" font-size="42" font-weight="700" fill="#4ea8de" text-anchor="middle">5,500+</text>
    <text x="100" y="90" font-family="system-ui" font-size="20" fill="#888888" text-anchor="middle">Tables</text>
  </g>

  <g transform="translate(500, 350)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#2a2a4a"/>
    <text x="100" y="55" font-family="system-ui" font-size="42" font-weight="700" fill="#a855f7" text-anchor="middle">240K+</text>
    <text x="100" y="90" font-family="system-ui" font-size="20" fill="#888888" text-anchor="middle">Columns</text>
  </g>

  <g transform="translate(800, 350)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#2a2a4a"/>
    <text x="100" y="55" font-family="system-ui" font-size="42" font-weight="700" fill="#22c55e" text-anchor="middle">Instant</text>
    <text x="100" y="90" font-family="system-ui" font-size="20" fill="#888888" text-anchor="middle">Search</text>
  </g>

  <!-- URL -->
  <text x="600" y="570" font-family="monospace" font-size="28" fill="url(#accent)" text-anchor="middle">hcmtables.com</text>
</svg>
