# Oracle HCM SQL Pattern Corpus
# Purpose: 50 production-proven patterns for Oracle Fusion HCM reporting and integration
# Usage: system prompt for HCM SQL Clinic AI, $997 Pattern Library, Slack bot intelligence
# Last updated: 2026-04-11

metadata:
  version: "1.0.0"
  total_patterns: 50  # skeleton — fill in as you validate each
  categories:
    - effective_date_predicates
    - primary_flag_rules
